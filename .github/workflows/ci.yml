name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The scripts promise bash 3.2, but the image may put a Homebrew bash first
      # on PATH, where the test runner's shebang and every nested `bash` look.
      - name: bash 3.2 first on PATH
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: bash version
        run: |
          command -v bash
          bash --version | sed -n 1p
          if [ "$RUNNER_OS" = macOS ]; then
            bash -c '[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2 ]' \
              || { echo "::error::tests would not run under bash 3.2"; exit 1; }
          fi
      - name: yaml parser
        run: python3 -m pip install --quiet --break-system-packages pyyaml
      - name: syntax gate
        run: |
          for f in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$f"; done
      - name: regression tests
        env:
          # a missing parser must fail here, not silently skip the config checks
          REVIEW_TEST_REQUIRE_YAML: "1"
        run: ./tests/review-test.sh
